# Packaged copy of configs/default.yml for installed distributions.
hyperparameters:
  optimizer: AdamW
  pusb: True
  precision: "16-mixed"
  epochs: 100
  gradient_clip_val: 1.0
  batch_size: 128
  grad_accum: null
  lr_start: 1e-4
  lr_end: 1e-5
  scheduler: "CosineAnnealingLR"
  T0: 200
  weight_decay: 3e-4
  mutation_embedding_max_norm: 20.0
  stop_on_nan: True
  use_gc: True
  use_go: True
  use_pvc: True
  shuffle_pvc_across_genes: False
  gc_exclude_features: ["geneticConstraint"]
  position_encoding: "modulo"
  variant_token_schema: "original"
  variant_head: False
  variant_loss_weight: 0.0
  variant_token_ablate: []
  variant_labels_path: null
  variant_objective: "pooled_bce"
  variant_pairs_per_gene: 256
  variant_pairs_per_side: 96
  variant_frequency_qc: False
  min_callability_fraction: 0.8
  af_log10_floor: -6.0
  pu_class_prior: null
  threshold_positive_fraction: null
  evaluate_holdout_after_fit: True
  run_name: null
  gc_width: 32
  go_width: 512
  max_seq_len: 1024
  num_encoder_layers: 3
  d_model: 256
  dim_feedforward: 4096
  gv_attn_dim: 256
  nhead: 8
  depth_cls_head: 4
  dropout: 0.3
  threshold: 0.5
  C: 1
  penalty: "l2"
  solver: "liblinear"
  max_iter: 1000
  class_weight: "balanced"
  wandb: True
  return_attn: True
  num_workers: 0
  seed: 57
  mode: "inference"
