[project]
name = "varformer"
version = "1.0.0"
description = "Drug-target identification and prioritisation from population genetic variants."
authors = [{ name = "Aaron Wenteler" }]
maintainers = [{ name = "Aaron Wenteler", email = "a.wenteler@qmul.ac.uk" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = "==3.9.*"
keywords = [
    "drug discovery",
    "drug target prioritization",
    "population genetics",
    "transformers",
    "positive-unlabeled learning",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    # === core ML stack — exact pins, do not relax (reproducibility) ===
    "torch==2.1.1",
    "pytorch-lightning==2.1.1",
    "torchmetrics==1.2.0",
    "numpy==1.23.5",
    "pandas==2.0.0",
    "scipy==1.10.1",
    "scikit-learn==1.2.2",
    # === data / IO ===
    "biopython==1.81",
    "biorosetta==0.3.2",
    "biothings-client==0.4.1",
    "cyvcf2>=0.31.1",
    "polars==1.31.0",
    "pyarrow==21.0.0",
    "pysam==0.22.1",
    "pyyaml==6.0.1",
    "openpyxl==3.1.5",
    # === modeling extras ===
    "fair-esm==2.0.0",
    "optuna==3.4.0",
    "shap==0.41.0",
    "xgboost==1.7.5",
    "umap-learn==0.5.4",
    "wandb==0.16.0",
    # === plotting ===
    "matplotlib==3.7.1",
    "seaborn==0.12.2",
    "plotly>=6.5.2",
    "kaleido>=1.2.0",
    "adjustText==1.3.0",
    "statsmodels>=0.14.5",
    # === utility ===
    "tabulate==0.9.0",
    "tqdm==4.65.0",
    "numba==0.60.0",
    # === config + notebook support ===
    "pydantic>=2.0",
    "ipykernel>=6.30.0",
]

[project.urls]
Homepage = "https://github.com/aaronwtr/Varformer"
Repository = "https://github.com/aaronwtr/Varformer"
Issues = "https://github.com/aaronwtr/Varformer/issues"
Changelog = "https://github.com/aaronwtr/Varformer/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "ruff",
]
notebook = [
    "notebook>=7.4.4",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["varformer*"]
exclude = ["benchmark*", "tests*", "paper*", "notebooks*", "scripts*", "src*"]

[tool.setuptools.package-data]
varformer = ["configs/*.yml", "configs/paths/*.yml"]

[tool.pytest.ini_options]
